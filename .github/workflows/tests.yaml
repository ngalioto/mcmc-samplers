name: Tests

# Manual only (Actions tab -> Tests -> Run workflow), so pushes don't
# trigger runs or failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest

  # bside uses DRAM through bside.sysid.Posterior; make sure changes here
  # don't break that handshake.
  bside:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ngalioto/bside
          path: bside
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . -e "./bside[dev]"
      - run: pytest bside/tests/test_sysid.py -k dram
